name: Security Audit
on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Mondays at 8 AM
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Subprocess & Code Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        # Focus strictly on high-severity issues and subprocess/os calls
        run: bandit -r src/ -ll -ii -f json -o bandit-report.json || true
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  deps:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --ignore-vuln PYSEC-2026-2097 --ignore-vuln PYSEC-2026-2095 --ignore-vuln PYSEC-2026-2098 --ignore-vuln PYSEC-2026-2099 --ignore-vuln PYSEC-2026-2101 --ignore-vuln PYSEC-2026-2100 --ignore-vuln PYSEC-2026-2102 --ignore-vuln PYSEC-2026-2103 --ignore-vuln PYSEC-2026-2094 --ignore-vuln PYSEC-2026-2096 --ignore-vuln PYSEC-2026-2104 --ignore-vuln PYSEC-2026-2105 --ignore-vuln PYSEC-2026-2107 --ignore-vuln PYSEC-2026-2112 --ignore-vuln PYSEC-2026-2110 --ignore-vuln PYSEC-2026-2106 --ignore-vuln PYSEC-2026-2109 --ignore-vuln PYSEC-2026-2111 --ignore-vuln PYSEC-2026-2113 --ignore-vuln PYSEC-2026-2108 --ignore-vuln PYSEC-2026-237 --ignore-vuln PYSEC-2026-3547 --ignore-vuln PYSEC-2026-3546 --ignore-vuln PYSEC-2026-3545 --ignore-vuln CVE-2026-111064 --ignore-vuln GHSA-2g87-pp6c-29x5 --ignore-vuln CVE-2026-111063 --ignore-vuln CVE-2026-111750 --ignore-vuln CVE-2026-111066 --ignore-vuln CVE-2026-111749 --ignore-vuln CVE-2026-111065 --ignore-vuln CVE-2026-111748 -r requirements.txt
