name: Entropy Maintenance

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  entropy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git log churn analysis

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git User
        run: |
          git config user.name "Entropy Bot"
          git config user.email "entropy@example.com"

      - name: Run Entropy Scan
        run: python entropy_scan.py

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -f entropy_report.md ]]; then
            echo "Report generated."
          else
            echo "No report generated."
            exit 0
          fi

          # Check if any files were deleted or moved (git status would show changes if we didn't commit yet)
          # create-pull-request action commits changes.

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: Entropy Liability Reduction"
          title: "[Entropy] Maintenance - Liability Reduction"
          body-path: entropy_report.md
          branch: entropy-maintenance
          base: main
          delete-branch: true
          labels: |
            entropy
            maintenance
