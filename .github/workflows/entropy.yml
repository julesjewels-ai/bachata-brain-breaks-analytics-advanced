name: Entropy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-entropy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install
          make install
          source venv/bin/activate && pip install pytest-cov
      - name: Run Entropy Protocol
        run: |
          source venv/bin/activate && npx ts-node scripts/entropy.ts
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: '[Entropy] Maintenance - Liability Reduction'
          body-path: entropy_report.md
          branch: entropy-maintenance
          labels: maintenance, automated pr
          delete-branch: true
