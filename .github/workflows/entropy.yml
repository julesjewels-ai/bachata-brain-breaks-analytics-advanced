name: Entropy Daily Audit
on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    name: Entropy Liability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov pydeps pytest-mock aioresponses
      - name: Run Entropy
        run: python scripts/entropy.py
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: '[Entropy] Maintenance - Liability Reduction'
          body-path: entropy_report.md
          branch: entropy-maintenance
          delete-branch: true
