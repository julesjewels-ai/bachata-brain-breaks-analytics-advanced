name: Entropy Daily Audit

on:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git churn calculation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Run Entropy Audit
        run: |
          npx ts-node scripts/entropy.ts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[Entropy] Maintenance - Liability Reduction"
          title: "[Entropy] Maintenance - Liability Reduction"
          body-path: entropy_report.md
          branch: entropy-maintenance
          delete-branch: true
