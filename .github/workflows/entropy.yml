name: Entropy Protocol (Sanitation & De-inflation)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-entropy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt pytest-cov pydeps

      - name: Run Entropy Protocol
        run: |
          python scripts/entropy.py > entropy_pr_body.md || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(entropy): Maintenance - Liability Reduction"
          branch: "chore/entropy-maintenance"
          title: "[Entropy] Maintenance - Liability Reduction"
          body-path: entropy_pr_body.md
          delete-branch: true
          labels: maintenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
