name: Entropy Maintenance

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  entropy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Needed for git log/churn analysis

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools
        pip install -r requirements.txt

    - name: Run Entropy Scan
      run: python entropy_scan.py

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "[Entropy] Maintenance - Liability Reduction"
        title: "[Entropy] Maintenance - Liability Reduction"
        body-path: entropy_report.md
        branch: entropy-maintenance
        base: main
        delete-branch: true
