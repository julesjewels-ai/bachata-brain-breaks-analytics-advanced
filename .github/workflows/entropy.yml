name: Entropy

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  entropy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git log churn check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pip-tools
          pip install -r requirements.txt

      - name: Run Entropy Scan
        run: |
          python entropy_scan.py

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          title: '[Entropy] Maintenance - Liability Reduction'
          body-path: entropy_report.md
          branch: entropy/maintenance
          commit-message: 'refactor(entropy): prune liability and quarantine rot'
          delete-branch: true
