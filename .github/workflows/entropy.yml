name: Entropy Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  entropy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Needed for git log churn analysis

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Entropy Scan
        run: python entropy_scan.py

      - name: Verify Stability
        run: pytest

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[Entropy] Maintenance - Liability Reduction"
          title: "[Entropy] Maintenance - Liability Reduction"
          body-path: entropy_report.md
          branch: entropy-maintenance
          delete-branch: true
