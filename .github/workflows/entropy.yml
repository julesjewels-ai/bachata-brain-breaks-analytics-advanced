name: Entropy Liability Reduction

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:      # Allow manual triggering

jobs:
  run-entropy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to get git history for churn calculation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run Entropy Protocol
        run: |
          python scripts/entropy.py

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "changes_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes_exist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Entropy Report
        id: get_report
        run: |
          if [[ -f entropy_report.md ]]; then
            echo "report<<EOF" >> "$GITHUB_OUTPUT"
            cat entropy_report.md >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "report=No report generated." >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes_exist == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[Entropy] Maintenance - Liability Reduction"
          branch: "entropy/maintenance"
          title: "[Entropy] Maintenance - Liability Reduction"
          body: |
            This PR was automatically generated by the Entropy protocol to manage test inflation and liability.

            Please review the changes and merge if they adhere to the project's quality standards.

            The detailed report of actions taken is generated by the script and can be reviewed in the commit history or CI logs.

            ${{ steps.get_report.outputs.report }}
          delete-branch: true
